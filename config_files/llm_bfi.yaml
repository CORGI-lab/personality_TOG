
hydra:
  job:
    chdir: false   # run from the repository root; all paths are relative to it
  run:
    dir: ./output/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Config for metrics/bfi_eval.py (BFI-44 probe of the trait prompts).
# The probe is answered by a generation model (LLM_Interaction/llm_models_api.generate_response);
# results go to <output_path>/<model_name>/<trait>/.
#   GPT-4o:           api_source: openai,     model_name: gpt-4o
#   Gemini 2.0 Flash: api_source: open_route, model_name: google/gemini-2.0-flash-001
#   Qwen3-Next-80B:   api_source: ollama,     model_name: qwen3-next:80b
model_name: google/gemini-2.0-flash-001
api_source: open_route
project_root: .
output_path: ./storage/chatgpt_new/metric/llm_metric/hpc/llm_metric_SYS/BFI
domain: Restaurant

sys_prompt_path: ./LLM_Interaction/prompts/llm_bfiEvaluator_prompt_SYS.yml
bfi_items_path: ./bfi_44/bfi.json

gpt_temperature: 0.7
gpt_max_tokens: 350
# Keep existing responses (the released BFI outputs) instead of re-querying
skip_existing: true
