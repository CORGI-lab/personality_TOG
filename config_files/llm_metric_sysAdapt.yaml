
hydra:
  job:
    chdir: false   # run from the repository root; all paths are relative to it
  run:
    dir: ./output/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Config for metrics/llm_metric_sysAdapt.py (System Adaptation Score, 1-5)
project_root: .
dialog_path: ./storage/chatgpt_new
prompt_name: null
output_path: ./storage/chatgpt_new/metric/llm_metric/hpc/sys_adaptation/gpt5_mini
domain: [Restaurant, Hotel]
date: null

sys_prompt_path: ./LLM_Interaction/prompts/llm_metric_prompt.yml

# LLM judge (LLM_Interaction/llm_models_api.judge_response)
#   GPT-5-mini (default): judge_provider: open_route, judge_model: openai/gpt-5-mini, reasoning_effort: low
#   Gemma:                judge_provider: ollama,     judge_model: gemma4:31b-cloud,  reasoning_effort: null
judge_provider: open_route
judge_model: openai/gpt-5-mini
reasoning_effort: low
gpt_max_tokens: 4000          # for reasoning models this covers reasoning + answer
num_workers: 16               # parallel judge requests

# Skip dialogues that already have a response.txt (resume a run; no API calls for released outputs)
skip_existing: true
