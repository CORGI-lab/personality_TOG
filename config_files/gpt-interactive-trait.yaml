
hydra:
  job:
    chdir: false   # run from the repository root; all paths are relative to it
  run:
    dir: ./output/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Generation model used for BOTH the user agent and the system agent
# (LLM_Interaction/llm_models_api.generate_response). Paper models:
#   GPT-4o:           api_source: openai,     model_name: gpt-4o,                      model: gpt4
#   Gemini 2.0 Flash: api_source: open_route, model_name: google/gemini-2.0-flash-001, model: gemeni
#   Qwen3-Next-80B:   api_source: ollama,     model_name: qwen3-next:80b,              model: qwen3
model_name: google/gemini-2.0-flash-001
model: gemeni           # output folder name
project_root: .
dataset_path: ./service_results/Restaurants_1_normalized.csv #Restaurants_1_normalized.csv #Hotels_4_normalized2.csv #Travel_1.csv      #Restaurants_1.csv           #Media_2.csv
prompt_name: restaurant_trait_gemeni #ministral #gemma12b
output_path: ./storage/chatgpt_new/Restaurant #ministral #gemma12b
domain: Restaurant #Hotel #Media #Travel #Restaurant
service_name: Restaurants_1 #Hotels_4 #Media_2 #Travel_1 #Restaurants_1
# System prompt for the system assistant
sys_prompt_path : ./LLM_Interaction/prompts/Restaurant/gemeni/restaurant_prompt_neutral_SYS.yml #Hotel/gpt4/hotel_try_gpt_SYS.yml #Restaurant/claude/restaurant_prompt_neutral_SYS_claude.yml  #restaurant_prompt_trying_SYS_claude.yml  #restaurant_prompt_trait_SYS_claude.yml     #Travel/travel_prompt_trying_SYS.yml    #Restaurant/restaurant_prompt_trying_SYS.yml                        #Media_2/media_prompt_trying_SYS.yml
#user prompt for the user simulator   
user_prompt_path : ./LLM_Interaction/prompts/Restaurant/restaurant_prompt_trait_USER.yml #Hotel/hotel_trait_USER.yml #Restaurant/restaurant_prompt_trait_USER.yml #Travel/travel_prompt_trait_USER.yml                 #Restaurant/restaurant_prompt_trait_USER.yml                         #Media_2/media_prompt_trait_USER.yml
#dialogue setting
early_stopping_patience: 3
add_example : true
max_turns: 40
max_iteration: 70
max_api: 5
#STOP_PHRASES : ["Have a good day!", "Goodbye", "No, thank you", "Thanks, that's all", "I'm done"]
dialog_id : 43_00000
#gpt setting
api_source: open_route  # openai | open_route | ollama
gpt_temperature : 0.7
gpt_max_tokens : 250

