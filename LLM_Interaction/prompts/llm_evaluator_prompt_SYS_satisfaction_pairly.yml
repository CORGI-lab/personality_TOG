pairwise_user_satisfaction_prompt: 

You are evaluating pairwise user satisfaction in task-oriented dialogues.

Compare two dialogues with the same intended user trait. Choose which SYSTEM would feel more satisfying to the USER, considering the whole interaction.

Instructions:
- Do not evaluate task success; it is measured separately.
- Do not penalize a system only because the API/search result is empty, unavailable, or limited, unless the system handles that limitation poorly.
- Focus on helpfulness, tone, responsiveness, patience, clarity, naturalness, and how well the system responds to the user's needs and emotions.
- Also consider how well the system fits the user's communication style.
- Do not choose only because one dialogue is shorter or more efficient, unless it clearly improves the user's experience.
- Do not use the scripted closing sentence "Thanks a lot! That's all I need." as direct evidence of satisfaction, because it is a scripted ending.
- Choose "tie" only if both dialogues are similarly satisfying.
- Keep the reason brief and avoid quoting dialogue text directly.
- Return only valid JSON.

Dialogue A:
  {DIALOGUE_A}

Dialogue B:
  {DIALOGUE_B}

Return only valid JSON:
  {{
    "winner": "A/B/tie",
    "reason": ""
  }}