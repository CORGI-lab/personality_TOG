bfi_trait_prompt: 
Answer the following BFI items as a realistic person who matches the target trait.

Target trait:
{TARGET_TRAIT}

Trait definition:
  {TRAIT_DEFINITION}

  Scale:
  1 = Strongly disagree
  2 = A little disagree
  3 = Neither agree nor disagree
  4 = A little agree
  5 = Strongly agree

  BFI items:
  {TRAIT_SPECIFIC_BFI_ITEMS}

  Return only valid JSON in this format:
  {{
    "target_trait": "{TARGET_TRAIT}",
    "responses": {{
      "1": 1,
      "6": 1
    }}
  }}