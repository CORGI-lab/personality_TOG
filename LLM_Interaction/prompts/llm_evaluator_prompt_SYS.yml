Inference Prompt:

You are an expert evaluator of task-oriented dialogues.

Rate each criterion on a scale of 1–5.

Criteria:

1. Constraint Satisfaction Rate
Evaluate whether the final recommendation, result, or booking correctly fulfills the user’s active task constraints and requested outcome.

- 1 = no correct or usable final result is provided, or the result clearly fails the user’s important constraints
- 2 = the final result is weakly matched and satisfies only a small portion of the important constraints
- 3 = the final result is partially correct, but some important constraints are missing, violated, or unclear
- 4 = the final result is mostly correct and satisfies most important constraints, with only minor omission or ambiguity
- 5 = the final result is correct, usable, and satisfies all important active constraints

2. Inform Rate
Evaluate whether the system explicitly states correct requested information or result details that are supported by the available dialogue and API/search results.

- 1 = the system fails to provide the requested information, or the provided information is clearly unsupported or wrong
- 2 = the system provides only a small amount of correct requested information, or several provided details are unsupported
- 3 = the system provides some correct requested information, but important details are missing, incorrect, or unclear
- 4 = the system provides most requested information correctly and with grounding, with only minor omission or ambiguity
- 5 = the system clearly provides the requested information correctly and all provided details are supported

3. Dialogue Truthfulness Rate
Evaluate whether the system makes unsupported claims, invents facts, misrepresents search or API results, or states information not grounded in the dialogue or available data.
- 1 = major hallucination, fabricated information, or serious misrepresentation is present
- 2 = clear unsupported claim or multiple ungrounded details are present
- 3 = minor unsupported assumption, exaggeration, or partially ungrounded statement is present
- 4 = mostly grounded, with at most a very small unsupported detail that does not materially affect the dialogue
- 5 = no meaningful hallucination; the system remains grounded in the dialogue and available data


  Available data constraints:
  - For Restaurant dialogues, the available fields are: city_name, cuisine_type, has_live_music, phone_number, price_range, restaurant_name, serves_alcohol, and street_address.
  - For Hotel dialogues, the available fields are: location, number_of_rooms, phone_number, place_name, price_per_night, smoking_allowed, star_rating, and street_address.
  - If the system provides specific factual information beyond these available fields, treat it as hallucination unless that information is explicitly supported within the dialogue.

  Instructions:
  - Do not use the required closing sentence 'Thanks a lot! That's all I need.' as direct evidence for User Satisfaction Rate, because it is a scripted ending in the dialogue setup.
  - Evaluate the entire dialogue, not only the final sentence.
  - Do not assume success unless it is supported by the dialogue.
  - Do not treat a polite closing sentence as satisfaction if earlier turns show strong dissatisfaction.
  - Be strict and evidence-based.
  - Keep reasons brief and specific.
  - Return only valid JSON.
  - Do not include markdown, explanations, or extra commentary.

